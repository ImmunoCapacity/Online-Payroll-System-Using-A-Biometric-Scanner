# ---------------------------------------------------------------
# Database (MySQL via XAMPP). Import database/payroll_schema.sql first.
# XAMPP's default MySQL root password is blank.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/Payroll_DB?serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=

# The schema is managed by database/payroll_schema.sql, not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# Web server
# ---------------------------------------------------------------
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# The HTML/CSS/JS frontend lives in the repository root (one level above
# backend/). It is served by this same server so the session cookie works
# without CORS. Only *.html, css/ and js/ are exposed — see WebConfig.
spring.web.resources.add-mappings=false
frontend.dir=..

# ---------------------------------------------------------------
# First System Administrator account
# If the users table is empty on startup and both values are set, this
# account is created. Remove the values after the first run.
# ---------------------------------------------------------------
bootstrap.admin.email=
bootstrap.admin.password=

# ---------------------------------------------------------------
# ZKTeco K40 biometric device
#   On the K40: Menu -> Comm. -> Ethernet (IP), Comm Key (0 = none).
#   The device's "User ID" for each person must equal the employee's
#   fingerprint_id in the database.
# ---------------------------------------------------------------
device.ip=192.168.1.201
device.port=4370
device.comm-key=0
device.machine-number=1

# ---------------------------------------------------------------
# Email (for "Distribute Payslips")
# Gmail: turn on 2-Step Verification for the sending account, then create
# an App Password (Google Account -> Security -> App passwords) and put
# it below — not the normal Gmail password. Leave the username blank to
# keep emailing turned off.
# ---------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Shown as the sender; defaults to spring.mail.username.
payslip.mail.from=
payslip.mail.school-name=STI College Balayan

# ---------------------------------------------------------------
# Attendance rules (paper: 15-minute grace period before tardiness)
# ---------------------------------------------------------------
attendance.standard-start=08:00
attendance.grace-minutes=15

# Faculty/Admin staff: biometric office time that overlaps an approved class
# is not paid twice (teaching hours are paid from Faculty Teaching Hours).
payroll.exclude-teaching-from-office-hours=true
