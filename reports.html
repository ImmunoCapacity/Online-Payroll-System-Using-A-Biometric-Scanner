<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports — Payroll</title>
    <link rel="icon" type="image/png" href="sti_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/payrollpro.css" rel="stylesheet">
    <link href="css/reports.css" rel="stylesheet">
</head>

<body class="pp-app pp-app-shell">

    <!-- Sidebar -->
    <div id="pp-sidebar-mount"></div>

    <div class="pp-shell-main">

        <div id="pp-topbar-mount"></div>

        <main class="pp-content reports-page">

            <!-- Page header -->
            <header class="pp-content-header">
                <h1 class="pp-content-title">Reports</h1>
                <p class="pp-content-subtitle">
                    Payroll, payslip, 13th month pay, and government contribution reports.
                </p>
            </header>

            <div class="reports-workspace">

                <!-- Report content -->
                <section class="report-content">

                    <!-- Breadcrumb -->
                    <div class="report-breadcrumb">
                        <span>Reports</span>
                        <span>/</span>
                        <span id="reportParent">Payroll</span>
                        <span>/</span>
                        <strong id="reportBreadcrumb">Payroll Report</strong>
                    </div>

                    <!-- Header -->
                    <div class="report-header">

                        <div class="report-header-info">
                            <h2 id="reportTitle">Payroll Report</h2>
                            <p id="reportDescription">
                                Payroll summary for the selected period:
                                gross pay, itemised deductions and net pay.
                            </p>
                        </div>

                        <div class="report-actions">
                            <button type="button" class="report-action-button" id="printReport">
                                <i class="bi bi-printer"></i> Print
                            </button>
                            <button type="button" class="report-action-button" id="exportExcel">
                                <i class="bi bi-file-earmark-spreadsheet"></i> Export Excel
                            </button>
                            <button type="button" class="report-action-button primary" id="exportPdf">
                                <i class="bi bi-file-earmark-pdf"></i> Export PDF
                            </button>
                        </div>

                    </div>

                    <!-- Filters -->
                    <div class="report-filter-card" id="reportFilters">

                        <div class="report-filter">
                            <label for="payrollPeriod">Payroll period</label>
                            <select data-clearable id="payrollPeriod" class="form-select">
                                <option value="all" hidden data-hint>All payroll periods</option>
                            </select>
                        </div>

                        <div class="report-filter">
                            <label for="employeeType">Employee type</label>
                            <select data-clearable id="employeeType" class="form-select">
                                <option value="all" hidden data-hint>All employees</option>
                                <option value="faculty">Faculty</option>
                                <option value="admin">Administrative Staff</option>
                                <option value="both">Faculty/Admin</option>
                            </select>
                        </div>

                        <div class="report-filter report-search">
                            <label for="reportSearch">Search</label>
                            <input type="text" id="reportSearch" maxlength="100" class="form-control" placeholder="Name or ID">
                        </div>

                        <button type="button" class="report-generate-button" id="generateReport">
                            Generate
                        </button>

                    </div>

                    <!-- Table -->
                    <div class="report-table-card">
                        <div class="report-table-wrapper">
                            <table class="report-table">
                                <thead id="reportTableHead"></thead>
                                <tbody id="reportTableBody"></tbody>
                                <tfoot id="reportTableFooter"></tfoot>
                            </table>
                        </div>
                    </div>

                </section>

            </div>

        </main>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data-store.js"></script>
    <script src="js/confirm-modal.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/payrollpro-layout.js"></script>
    <script src="js/select-hint.js"></script>
    <script src="js/reports.js"></script>

</body>
</html>
