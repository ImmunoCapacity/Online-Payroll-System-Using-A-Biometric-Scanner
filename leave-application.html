<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Role access -->
    <script>
        window.PP_ALLOWED_ROLES = ['Payroll Master', 'Payroll Staff'];
    </script>

    <script src="js/auth-guard.js"></script>

    <!-- Meta -->
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Leave Management — PayrollPro</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- PayrollPro styles -->
    <link
        href="css/payrollpro.css"
        rel="stylesheet"
    >

    <link
        href="css/leave-application.css"
        rel="stylesheet"
    >

</head>


<body class="pp-app pp-app-shell">

    <!-- Sidebar -->
    <div id="pp-sidebar-mount"></div>

    <div class="pp-shell-main">

        <!-- Topbar -->
        <div id="pp-topbar-mount"></div>

        <!-- Main content -->
        <main class="pp-content">

            <!-- Page header -->
            <header class="leave-page-header">

                <h1 class="pp-content-title">
                    Leave Management
                </h1>

                <p class="pp-content-subtitle">
                    View and manage employee leave requests.
                </p>

            </header>


            <!-- Filters -->
            <section class="leave-filter-bar">

                <div class="leave-filter leave-search-filter">

                    <label for="leaveSearch">
                        Search
                    </label>

                    <div class="leave-search">

                        <i class="bi bi-search"></i>

                        <input
                            type="text"
                            id="leaveSearch"
                            class="form-control pp-form-control"
                            placeholder="Search employee or employee ID"
                        >

                    </div>

                </div>


                <div class="leave-filter">

                    <label for="leaveTypeFilter">
                        Leave Type
                    </label>

                    <select
                        id="leaveTypeFilter"
                        class="form-select pp-form-select"
                    >

                        <option value="All">
                            All leave types
                        </option>

                        <option value="Sick">
                            Sick Leave
                        </option>

                        <option value="Vacation">
                            Vacation Leave
                        </option>

                        <option value="Maternity">
                            Maternity Leave
                        </option>

                        <option value="Paternity">
                            Paternity Leave
                        </option>

                        <option value="Emergency">
                            Emergency Leave
                        </option>

                        <option value="Personal">
                            Personal Leave
                        </option>

                    </select>

                </div>


                <div class="leave-filter">

                    <label for="leaveStatusFilter">
                        Status
                    </label>

                    <select
                        id="leaveStatusFilter"
                        class="form-select pp-form-select"
                    >

                        <option value="All">
                            All statuses
                        </option>

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Approved">
                            Approved
                        </option>

                        <option value="Rejected">
                            Rejected
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>


                <div class="leave-filter">

                    <label for="leaveDateFilter">
                        Leave Date
                    </label>

                    <input
                        type="date"
                        id="leaveDateFilter"
                        class="form-control pp-form-control"
                    >

                </div>

            </section>


            <!-- Leave request list -->
            <section class="leave-request-card">

                <div class="leave-request-header">

                    <div>

                        <h2>
                            Leave Requests
                        </h2>

                        <span id="leaveListCount">
                            0 records
                        </span>

                    </div>

                </div>


                <!-- Table -->
                <div class="leave-table-container">

                    <table class="leave-table">

                        <thead>

                            <tr>

                                <th class="employee-column">
                                    Employee
                                </th>

                                <th class="type-column">
                                    Leave Type
                                </th>

                                <th class="date-column">
                                    Date From
                                </th>

                                <th class="date-column">
                                    Date To
                                </th>

                                <th class="days-column">
                                    Days
                                </th>

                                <th class="pay-column">
                                    Pay
                                </th>

                                <th class="filed-column">
                                    Date Filed
                                </th>

                                <th class="status-column">
                                    Status
                                </th>

                                <th class="remarks-column">
                                    Remarks
                                </th>

                            </tr>

                        </thead>


                        <tbody id="leaveTableBody"></tbody>

                    </table>


                    <!-- Empty state -->
                    <div
                        id="leaveEmptyState"
                        class="leave-empty-state d-none"
                    >

                        <i class="bi bi-calendar-x"></i>

                        <span>
                            No leave requests found.
                        </span>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- Scripts -->
    <script src="js/data-store.js"></script>

    <script src="js/toast.js"></script>

    <script src="js/payrollpro-layout.js"></script>

    <script src="js/leave-application.js"></script>

</body>

</html>
