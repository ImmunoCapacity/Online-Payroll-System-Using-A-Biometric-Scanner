<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive — Payroll</title>
    <link rel="icon" type="image/png" href="sti_logo.png">
    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/payrollpro.css" rel="stylesheet">
    <link href="css/utility.css" rel="stylesheet">
</head>
<body class="pp-app pp-app-shell">

    <div id="pp-sidebar-mount"></div>

    <div class="pp-shell-main">
        <div id="pp-topbar-mount"></div>

        <main class="pp-content">
            <header class="pp-content-header">
                <div>
                    <h1 class="pp-content-title" id="archiveTitle">Archive</h1>
                    <p class="pp-content-subtitle" id="archiveSubtitle">Employees who no longer work here. Their payroll, attendance and leave history is kept.</p>
                </div>
            </header>

            <div class="pp-util-note">
                <i class="bi bi-info-circle"></i>
                <div id="archiveNote">This list is read-only. The Payroll Master archives and restores employees in Employee Records.</div>
            </div>

            <!-- Archived employees -->
            <div class="pp-widget" id="employeesView">
                <div class="pp-widget-body">
                    <div class="pp-filter-bar" role="search">
                        <div class="pp-filter-group search">
                            <label for="archiveSearch" class="pp-form-label">Search</label>
                            <div class="pp-search-input">
                                <i class="bi bi-search"></i>
                                <input type="search" class="form-control pp-form-control" id="archiveSearch" maxlength="100" placeholder="Search by ID or name…">
                            </div>
                        </div>
                    </div>
                    <p class="pp-table-hint" id="archiveCount"></p>
                    <div class="pp-table-wrap">
                        <table class="pp-table w-100">
                            <thead>
                                <tr>
                                    <th>Employee ID</th>
                                    <th>Name</th>
                                    <th>Employee Type</th>
                                    <th>Reason</th>
                                    <th>Date Hired</th>
                                    <th>Archived On</th>
                                </tr>
                            </thead>
                            <tbody id="archiveBody"></tbody>
                        </table>
                    </div>
                    <div class="pp-empty-state d-none" id="archiveEmpty">No archived employees.</div>
                </div>
            </div>

            <!-- Archived deduction tables (BIR, Pag-IBIG, SSS, PhilHealth) -->
            <div id="tablesView" class="d-none">
                <div id="tableArchives"></div>
                <div class="pp-widget d-none" id="tablesEmptyWrap">
                    <div class="pp-widget-body">
                        <div class="pp-empty-state" id="tablesEmpty">No archived tables.</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/data-store.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/payrollpro-layout.js"></script>
    <script src="js/archive.js"></script>
</body>
</html>
