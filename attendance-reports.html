<!DOCTYPE html>
<html lang="en">
<head>
    <script>window.PP_ALLOWED_ROLES = ['Payroll Staff', 'Payroll Master'];</script>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Reports — Payroll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/payrollpro.css" rel="stylesheet">
</head>
<body class="pp-app pp-app-shell">

    <div id="pp-sidebar-mount"></div>

    <div class="pp-shell-main">
        <div id="pp-topbar-mount"></div>

        <main class="pp-content">
            <header class="pp-content-header">
                <h1 class="pp-content-title">Attendance Reports</h1>
                <p class="pp-content-subtitle">Per-employee attendance summary based on recorded time-ins.</p>
            </header>

            <div class="pp-widget">
                <div class="pp-widget-header">
                    <h2 class="pp-widget-title">Employee Attendance Summary</h2>
                </div>
                <div class="pp-widget-body">
                    <div class="pp-filter-bar" role="search">
                        <div class="pp-filter-group">
                            <label for="reportType" class="pp-form-label">Employee Type</label>
                            <select class="form-select pp-form-select" id="reportType">
                                <option value="all">All</option>
                                <option value="Faculty">Faculty</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <div class="pp-table-wrap">
                        <table class="pp-table w-100">
                            <thead>
                                <tr>
                                    <th>Employee</th>
                                    <th>Type</th>
                                    <th class="col-num">Present</th>
                                    <th class="col-num">Late</th>
                                    <th class="col-num">Absent</th>
                                    <th class="col-num">On Leave</th>
                                    <th class="col-num">Attendance Rate</th>
                                </tr>
                            </thead>
                            <tbody id="reportBody"></tbody>
                        </table>
                    </div>
                    <div class="pp-empty-state d-none" id="reportEmpty">No attendance records found for the selected filter.</div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data-store.js"></script>
    <script src="js/confirm-modal.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/payrollpro-layout.js"></script>
    <script src="js/attendance-reports.js"></script>
</body>
</html>
