<!DOCTYPE html>
<html lang="en">
<head>
    <script>window.PP_ALLOWED_ROLES = ['Payroll Master', 'System Administrator', 'Payroll Staff'];</script>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Records — PayrollPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/payrollpro.css" rel="stylesheet">
</head>
<body class="pp-app pp-app-shell">

    <div id="pp-sidebar-mount"></div>

    <div class="pp-shell-main">
        <div id="pp-topbar-mount"></div>

        <main class="pp-content">
            <header class="pp-content-header">
                <div>
                    <h1 class="pp-content-title">Employee Records</h1>
                    <p class="pp-content-subtitle">Maintain the employee list, department details, and active status for payroll and attendance workflows.</p>
                </div>
                <button type="button" class="btn btn-pp-primary" id="addEmployeeBtn">
                    <i class="bi bi-person-plus me-1"></i> Add Employee
                </button>
            </header>

            <div class="pp-summary-row" aria-label="Employee overview">
                <div class="pp-summary-card present">
                    <div class="pp-summary-label">Active Employees</div>
                    <div class="pp-summary-value" id="summaryActive">0</div>
                </div>
                <div class="pp-summary-card late">
                    <div class="pp-summary-label">Faculty</div>
                    <div class="pp-summary-value" id="summaryFaculty">0</div>
                </div>
                <div class="pp-summary-card absent">
                    <div class="pp-summary-label">Admin</div>
                    <div class="pp-summary-value" id="summaryAdmin">0</div>
                </div>
            </div>

            <section class="pp-widget" aria-labelledby="employeeListTitle">
                <div class="pp-widget-header">
                    <h2 class="pp-widget-title" id="employeeListTitle">Employee Directory</h2>
                </div>
                <div class="pp-widget-body">
                    <div class="pp-filter-bar" role="search">
                        <div class="pp-filter-group search">
                            <label for="employeeSearch" class="pp-form-label">Search</label>
                            <div class="pp-search-input">
                                <i class="bi bi-search"></i>
                                <input type="search" class="form-control pp-form-control" id="employeeSearch" placeholder="Search by name or email…">
                            </div>
                        </div>
                        <div class="pp-filter-group">
                            <label for="employeeDepartment" class="pp-form-label">Department</label>
                            <select class="form-select pp-form-select" id="employeeDepartment">
                                <option value="all">All</option>
                                <option value="Faculty">Faculty</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>
                        <div class="pp-filter-group">
                            <label for="employeeStatus" class="pp-form-label">Status</label>
                            <select class="form-select pp-form-select" id="employeeStatus">
                                <option value="all">All</option>
                                <option value="Active">Active</option>
                                <option value="On Leave">On Leave</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="pp-table-wrap">
                        <table class="pp-table" id="employeeTable">
                            <thead>
                                <tr>
                                    <th>Employee</th>
                                    <th>Department</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Status</th>
                                    <th class="text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="employeeBody"></tbody>
                        </table>
                        <div class="pp-empty-state d-none" id="emptyState">No employees match the current filters.</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="modal fade pp-modal" id="employeeModal" tabindex="-1" aria-labelledby="employeeModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title" id="employeeModalTitle">Add Employee</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="employeeForm" novalidate>
                    <div class="modal-body">
                        <input type="hidden" id="employeeId">

                        <div class="mb-3">
                            <label for="employeeName" class="pp-form-label">Full Name</label>
                            <input type="text" class="form-control pp-form-control" id="employeeName" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="employeeNumber" class="pp-form-label">Employee ID</label>
                                <input type="text" class="form-control pp-form-control" id="employeeNumber" placeholder="e.g. EMP-2026-001" required>
                                <div id="employeeNumberError" class="invalid-feedback"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="employeeDepartmentSelect" class="pp-form-label">Department</label>
                                <select class="form-select pp-form-select" id="employeeDepartmentSelect" required>
                                    <option value="">Select department</option>
                                    <option value="Faculty">Faculty</option>
                                    <option value="Admin">Admin</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="employeeEmail" class="pp-form-label">Email</label>
                                <input type="email" class="form-control pp-form-control" id="employeeEmail" required>
                            </div>
                            <div class="col-md-6">
                                <label for="employeePhone" class="pp-form-label">Phone</label>
                                <input type="tel" class="form-control pp-form-control" id="employeePhone" placeholder="0917-000-0000" pattern="[0-9+\-\s]{7,20}" title="Digits, spaces, + and - only (7–20 characters)" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="employeeStatusSelect" class="pp-form-label">Status</label>
                                <select class="form-select pp-form-select" id="employeeStatusSelect" required>
                                    <option value="Active">Active</option>
                                    <option value="On Leave">On Leave</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="employeeJoined" class="pp-form-label">Joined On</label>
                                <input type="date" class="form-control pp-form-control" id="employeeJoined" required>
                            </div>
                        </div>

                        <div class="mb-0">
                            <label for="employeeNotes" class="pp-form-label">Notes</label>
                            <textarea class="form-control pp-form-control" id="employeeNotes" rows="3" placeholder="Add a short note about the employee"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-pp-outline" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-pp-primary">Save Employee</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data-store.js"></script>
    <script src="js/confirm-modal.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/payrollpro-layout.js"></script>
    <script src="js/employee-records.js"></script>
</body>
</html>
