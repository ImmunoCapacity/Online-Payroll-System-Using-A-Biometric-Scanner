<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Trail — Payroll</title>
    <link rel="icon" type="image/png" href="sti_logo.png">
    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/payrollpro.css" rel="stylesheet">
    <link href="css/utility.css" rel="stylesheet">
</head>
<body class="pp-app pp-app-shell">

    <div id="pp-sidebar-mount"></div>

    <div class="pp-shell-main">
        <div id="pp-topbar-mount"></div>

        <main class="pp-content">
            <header class="pp-content-header d-flex flex-wrap justify-content-between align-items-start gap-2">
                <div>
                    <h1 class="pp-content-title">Audit Trail</h1>
                    <p class="pp-content-subtitle">Every change recorded in the system: who did what, and when. Entries can't be edited or deleted.</p>
                </div>
                <button type="button" class="btn btn-pp-outline" id="exportCsvBtn">
                    <i class="bi bi-filetype-csv me-1"></i> Export CSV
                </button>
            </header>

            <div class="pp-widget">
                <div class="pp-widget-body">
                    <div class="pp-filter-bar" role="search">
                        <div class="pp-filter-group">
                            <label for="auditFrom" class="pp-form-label">From</label>
                            <input type="date" class="form-control pp-form-control" id="auditFrom">
                        </div>
                        <div class="pp-filter-group">
                            <label for="auditTo" class="pp-form-label">To</label>
                            <input type="date" class="form-control pp-form-control" id="auditTo">
                        </div>
                        <div class="pp-filter-group">
                            <label for="auditUser" class="pp-form-label">User</label>
                            <select class="form-select pp-form-select" id="auditUser">
                                <option value="">All users</option>
                            </select>
                        </div>
                        <div class="pp-filter-group">
                            <label for="auditModule" class="pp-form-label">Module</label>
                            <select class="form-select pp-form-select" id="auditModule">
                                <option value="">All modules</option>
                            </select>
                        </div>
                        <div class="pp-filter-group search">
                            <label for="auditSearch" class="pp-form-label">Search</label>
                            <div class="pp-search-input">
                                <i class="bi bi-search"></i>
                                <input type="search" class="form-control pp-form-control" id="auditSearch" maxlength="100" placeholder="Action or details…">
                            </div>
                        </div>
                    </div>
                    <p class="pp-table-hint" id="auditCount"></p>
                    <div class="pp-table-wrap">
                        <table class="pp-table w-100">
                            <thead>
                                <tr>
                                    <th>Date &amp; Time</th>
                                    <th>User</th>
                                    <th>Module</th>
                                    <th>Action</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody id="auditBody"></tbody>
                        </table>
                    </div>
                    <div class="pp-empty-state d-none" id="auditEmpty">No entries match the filters.</div>
                </div>
            </div>
        </main>
    </div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/data-store.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/payrollpro-layout.js"></script>
    <script src="js/audit-trail.js"></script>
</body>
</html>
