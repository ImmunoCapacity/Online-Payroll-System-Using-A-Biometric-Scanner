<!DOCTYPE html>
<html lang="en">
<head>
    <script>window.PP_ALLOWED_ROLES = ['System Administrator'];</script>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Devices — Payroll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/payrollpro.css" rel="stylesheet">
</head>
<body class="pp-app pp-app-shell">

    <div id="pp-sidebar-mount"></div>

    <div class="pp-shell-main">
        <div id="pp-topbar-mount"></div>

        <main class="pp-content">
            <header class="pp-content-header d-flex flex-wrap justify-content-between align-items-start gap-2">
                <div>
                    <h1 class="pp-content-title">Biometric Devices</h1>
                    <p class="pp-content-subtitle">Register and manage the fingerprint scanners used for attendance.</p>
                </div>
                <button type="button" class="btn btn-pp-primary" id="addDeviceBtn">
                    <i class="bi bi-plus-lg me-1"></i> Add Device
                </button>
            </header>

            <div class="pp-widget">
                <div class="pp-widget-header">
                    <h2 class="pp-widget-title">Registered Devices</h2>
                </div>
                <div class="pp-widget-body">
                    <div class="pp-table-wrap">
                        <table class="pp-table w-100">
                            <thead>
                                <tr>
                                    <th>Device Name</th>
                                    <th>Location</th>
                                    <th>IP Address</th>
                                    <th>Status</th>
                                    <th>Date Added</th>
                                    <th class="col-actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="deviceBody"></tbody>
                        </table>
                    </div>
                    <div class="pp-empty-state d-none" id="deviceEmpty">No devices registered yet.</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Device Modal -->
    <div class="modal fade pp-modal" id="deviceModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title" id="deviceModalTitle">Add Device</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="deviceForm" novalidate>
                    <div class="modal-body">
                        <input type="hidden" id="deviceId">
                        <div class="mb-3">
                            <label for="deviceName" class="pp-form-label">Device Name</label>
                            <input type="text" class="form-control pp-form-control" id="deviceName" required>
                            <div class="invalid-feedback">Device name is required.</div>
                        </div>
                        <div class="mb-3">
                            <label for="deviceLocation" class="pp-form-label">Location</label>
                            <input type="text" class="form-control pp-form-control" id="deviceLocation" required>
                            <div class="invalid-feedback">Location is required.</div>
                        </div>
                        <div class="mb-3">
                            <label for="deviceIp" class="pp-form-label">IP Address</label>
                            <input type="text" class="form-control pp-form-control" id="deviceIp" placeholder="192.168.1.50" pattern="^(\d{1,3}\.){3}\d{1,3}$" required>
                            <div class="invalid-feedback">Enter a valid IPv4 address.</div>
                        </div>
                        <div class="mb-0">
                            <label for="deviceStatusSelect" class="pp-form-label">Status</label>
                            <select class="form-select pp-form-select" id="deviceStatusSelect" required>
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-pp-outline" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-pp-primary">Save Device</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data-store.js"></script>
    <script src="js/confirm-modal.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/payrollpro-layout.js"></script>
    <script src="js/biometric-devices.js"></script>
</body>
</html>
