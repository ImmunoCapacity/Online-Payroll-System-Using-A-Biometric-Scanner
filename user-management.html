<!DOCTYPE html>
<html lang="en">
<head>
    <script>window.PP_ALLOWED_ROLES = ['System Administrator'];</script>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management — Payroll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/payrollpro.css" rel="stylesheet">
</head>
<body class="pp-app pp-app-shell">

    <div id="pp-sidebar-mount"></div>

    <div class="pp-shell-main">
        <div id="pp-topbar-mount"></div>

        <main class="pp-content">
            <header class="pp-content-header d-flex flex-wrap justify-content-between align-items-start gap-2">
                <div>
                    <h1 class="pp-content-title">User Management</h1>
                    <p class="pp-content-subtitle">Manage system accounts for System Administrators, Payroll Masters, and Payroll Staff.</p>
                </div>
                <button type="button" class="btn btn-pp-primary" id="addUserBtn">
                    <i class="bi bi-plus-lg me-1"></i> Add User
                </button>
            </header>

            <div class="pp-widget">
                <div class="pp-widget-header">
                    <h2 class="pp-widget-title">System Accounts</h2>
                </div>
                <div class="pp-widget-body">
                    <div class="pp-table-wrap">
                        <table class="pp-table w-100">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Username</th>
                                    <th>Role</th>
                                    <th>Email</th>
                                    <th>Status</th>
                                    <th class="col-actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="userBody"></tbody>
                        </table>
                    </div>
                    <div class="pp-empty-state d-none" id="userEmpty">No system accounts found.</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit User Modal -->
    <div class="modal fade pp-modal" id="userModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title" id="userModalTitle">Add User</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="userForm" novalidate>
                    <div class="modal-body">
                        <input type="hidden" id="userId">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="userFirstName" class="pp-form-label">First Name</label>
                                <input type="text" class="form-control pp-form-control" id="userFirstName" required>
                            </div>
                            <div class="col-md-6">
                                <label for="userLastName" class="pp-form-label">Last Name</label>
                                <input type="text" class="form-control pp-form-control" id="userLastName" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="userUsername" class="pp-form-label">Username</label>
                            <input type="text" class="form-control pp-form-control" id="userUsername" required>
                            <div id="userUsernameError" class="invalid-feedback"></div>
                        </div>
                        <div class="mb-3">
                            <label for="userRole" class="pp-form-label">Role</label>
                            <select class="form-select pp-form-select" id="userRole" required>
                                <option value="System Administrator">System Administrator</option>
                                <option value="Payroll Master">Payroll Master</option>
                                <option value="Payroll Staff">Payroll Staff</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="userEmail" class="pp-form-label">Email</label>
                            <input type="email" class="form-control pp-form-control" id="userEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="userContact" class="pp-form-label">Contact Number</label>
                            <input type="tel" class="form-control pp-form-control" id="userContact" pattern="[0-9+\-\s]{7,20}" required>
                        </div>
                        <div class="form-check form-switch mb-0">
                            <input class="form-check-input" type="checkbox" role="switch" id="userActive" checked>
                            <label class="form-check-label" for="userActive">Account active</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-pp-outline" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-pp-primary">Save User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data-store.js"></script>
    <script src="js/confirm-modal.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/payrollpro-layout.js"></script>
    <script src="js/user-management.js"></script>
</body>
</html>
