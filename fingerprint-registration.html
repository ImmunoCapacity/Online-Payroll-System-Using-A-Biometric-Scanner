<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fingerprint Enrollment — Payroll</title>
    <script>window.PP_ALLOWED_ROLES = ['System Administrator'];</script>
    <script src="js/auth-guard.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/payrollpro.css" rel="stylesheet">
    <link href="css/fingerprint-registration.css" rel="stylesheet">
</head>
<body class="pp-app pp-app-shell">

    <div id="pp-sidebar-mount"></div>

    <div class="pp-shell-main">
        <div id="pp-topbar-mount"></div>

        <main class="pp-content">
            <header class="pp-content-header d-flex flex-wrap justify-content-between align-items-start gap-2">
                <div>
                    <h1 class="pp-content-title">Fingerprint Enrollment</h1>
                    <p class="pp-content-subtitle">Enroll employees on the biometric scanner for attendance tracking.</p>
                </div>
                <div class="pp-device-status" id="deviceStatus" role="status" aria-live="polite">
                    <span class="pp-device-dot connected" id="deviceDot"></span>
                    <span>Connected device: <strong id="deviceNameLabel">—</strong></span>
                </div>
            </header>

            <div class="pp-split-layout">
                <!-- Left: employee list -->
                <section class="pp-panel-left pp-card" aria-label="Employee list">
                    <div class="pp-card-header">Employees</div>
                    <div class="pp-card-body border-bottom">
                        <div class="pp-search-input">
                            <i class="bi bi-search"></i>
                            <input
                                type="search"
                                class="form-control pp-form-control"
                                id="employeeSearch"
                                placeholder="Search by name or employee number…"
                                autocomplete="off"
                            >
                        </div>
                    </div>
                    <div class="pp-employee-list" id="employeeList" role="listbox" aria-label="Select an employee"></div>
                </section>

                <!-- Right: enrollment panel -->
                <section class="pp-card" aria-label="Enrollment status">
                    <div class="pp-card-header">Enrollment Status</div>
                    <div id="enrollPanel">
                        <div class="pp-enroll-panel pp-no-selection" id="emptyState">
                            <i class="bi bi-person-lines-fill display-4 text-muted mb-3"></i>
                            <p>Select an employee from the list to view or manage fingerprint enrollment.</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data-store.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/payrollpro-layout.js"></script>
    <script src="js/fingerprint-registration.js"></script>
</body>
</html>
