<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — PayrollPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">
</head>
<body>

    <main class="login-page">
        <div class="login-card" role="main" aria-labelledby="brand-title">

            <!-- Institution logo placeholder -->
            <div class="logo-placeholder" aria-hidden="true">
                <i class="bi bi-building"></i>
            </div>

            <h1 class="brand-title text-center" id="brand-title">PayrollPro</h1>
            <p class="brand-subtitle text-center">Sign in with your institutional email</p>

            <!-- Locked account alert -->
            <div id="lockedAlert" class="alert-locked" role="alert" aria-live="polite">
                <i class="bi bi-lock-fill flex-shrink-0 mt-1"></i>
                <span>Account locked. Contact your administrator.</span>
            </div>

            <form id="loginForm" novalidate>
                <div id="statusMessage" class="alert-locked" role="status" aria-live="polite"></div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="name@institution.edu"
                        autocomplete="username"
                        required
                        aria-describedby="emailError"
                    >
                    <div id="emailError" class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            aria-describedby="passwordError"
                        >
                        <button
                            type="button"
                            class="password-toggle-btn"
                            id="togglePassword"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div id="passwordError" class="invalid-feedback d-block" style="display: none !important;"></div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-login" id="loginBtn">
                    <span id="loginBtnText">Log In</span>
                    <span id="loginBtnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                </button>
            </form>

            <p class="card-footer-text">
                Online Payroll System Using a Biometric Scanner
            </p>
        </div>
    </main>

    <!-- Demo controls to preview UI states (remove in production) -->
    <aside class="state-demo d-none d-md-block" aria-label="UI state preview">
        <label>Preview states</label>
        <div>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-state="default">Default</button>
            <button type="button" class="btn btn-outline-danger btn-sm" data-state="error">Error</button>
            <button type="button" class="btn btn-outline-primary btn-sm" data-state="loading">Loading</button>
            <button type="button" class="btn btn-outline-warning btn-sm" data-state="locked">Locked</button>
        </div>
    </aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
