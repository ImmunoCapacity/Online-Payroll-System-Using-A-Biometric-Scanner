<!DOCTYPE html>
<html lang="en">
<head>
    <script>window.PP_ALLOWED_ROLES = ['Faculty Staff', 'Administrative Staff'];</script>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Attendance — Payroll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/payrollpro.css" rel="stylesheet">
</head>
<body class="pp-app pp-app-shell">

    <div id="pp-sidebar-mount"></div>

    <div class="pp-shell-main">
        <div id="pp-topbar-mount"></div>

        <main class="pp-content">
            <header class="pp-content-header">
                <h1 class="pp-content-title">My Attendance</h1>
                <p class="pp-content-subtitle">Your daily time record for the selected period.</p>
            </header>

            <div class="pp-stat-row" aria-label="Attendance summary">
                <div class="pp-stat-card">
                    <div class="pp-stat-card-icon present" aria-hidden="true"><i class="bi bi-person-check-fill"></i></div>
                    <div class="pp-stat-label">Present Days</div>
                    <div class="pp-stat-value" id="statPresent">0</div>
                </div>
                <div class="pp-stat-card">
                    <div class="pp-stat-card-icon leave" aria-hidden="true"><i class="bi bi-exclamation-triangle-fill"></i></div>
                    <div class="pp-stat-label">Late Days</div>
                    <div class="pp-stat-value" id="statLate">0</div>
                </div>
                <div class="pp-stat-card">
                    <div class="pp-stat-card-icon payroll" aria-hidden="true"><i class="bi bi-calendar-x-fill"></i></div>
                    <div class="pp-stat-label">Absences</div>
                    <div class="pp-stat-value" id="statAbsent">0</div>
                </div>
            </div>

            <div class="pp-widget">
                <div class="pp-widget-header">
                    <h2 class="pp-widget-title">Time Record</h2>
                </div>
                <div class="pp-widget-body">
                    <div class="pp-table-wrap">
                        <table class="pp-table w-100">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th class="col-time">Time In</th>
                                    <th class="col-time">Time Out</th>
                                    <th class="col-hours">Hours</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceBody"></tbody>
                        </table>
                    </div>
                    <div class="pp-empty-state d-none" id="attendanceEmpty">No attendance records found.</div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data-store.js"></script>
    <script src="js/confirm-modal.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/payrollpro-layout.js"></script>
    <script src="js/my-attendance.js"></script>
</body>
</html>
